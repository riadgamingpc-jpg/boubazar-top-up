<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>RS Arena - Tournament</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 15px; }
        .card { background: #fff; padding: 20px; border-radius: 15px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .match-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .btn-action { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        .btn-join { background: #25d366; }
        .btn-copy { background: #007bff; }
    </style>
</head>
<body>

<div class="card">
    <h3 style="text-align:center;">বিকাশ/নগদ: 01851634841</h3>
    <div id="matchList"></div>
</div>

<script>
    let container = document.getElementById('matchList');
    let times = ["6:00 AM", "7:00 AM", "8:00 AM", "10:00 AM", "2:00 PM", "3:00 PM"];

    for (let i = 1; i <= 100; i++) {
        let fee = (i <= 10) ? 0 : (i <= 28 ? 20 : (i <= 46 ? 40 : (i <= 64 ? 60 : (i <= 82 ? 70 : 90))));
        let time = times[(i - 1) % 6];
        
        container.innerHTML += `
        <div class="match-row">
            <div>
                <b>Match #${i}</b> (${time})<br>
                <small>ফি: ${fee == 0 ? 'ফ্রি' : fee + ' TK'}</small>
            </div>
            <div>
                <button class="btn-action btn-join" id="j_${i}" onclick="joinMatch(${i})">জয়েন</button>
                <button class="btn-action btn-copy" onclick="copyText(${i}, '${time}', ${fee})">কপি</button>
            </div>
        </div>`;
    }

    function joinMatch(id) {
        let b = document.getElementById('j_' + id);
        b.disabled = true;
        b.innerText = "জয়েন";
        b.style.backgroundColor = "#ccc";
        alert("আপনি ম্যাচ #" + id + "-এ জয়েন করেছেন!");
    }

    // কপি করার নতুন উন্নত পদ্ধতি
    function copyText(id, time, fee) {
        let text = `RS Arena: ম্যাচ #${id} শুরু! ফি: ${fee == 0 ? 'ফ্রি' : fee + ' টাকা'}। সময়: ${time}। রুম আইডি: [আপনার আইডি], পাসওয়ার্ড: 1234।`;
        
        // ক্লিপবোর্ডে কপি করার জন্য নতুন টেকনিক
        navigator.clipboard.writeText(text).then(() => {
            alert("কপি হয়েছে! এখন হোয়াটসঅ্যাপে পেস্ট করুন।");
        }).catch(err => {
            alert("কপি হয়নি! দয়া করে নিজে সিলেক্ট করে কপি করুন।");
        });
    }
</script>

</body>
</html>
