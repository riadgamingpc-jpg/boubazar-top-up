<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Arena - Tournament App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f7f9fc; padding-bottom: 100px; }
        header { background-color: #fff; padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
        .wallet-badge { background-color: #ede7f6; color: #673ab7; padding: 6px 14px; border-radius: 20px; font-weight: bold; }
        .container { max-width: 500px; margin: 0 auto; padding: 15px; }
        .deposit-card { background-color: #512da8; color: #fff; border-radius: 16px; padding: 18px; margin-bottom: 25px; }
        .app-card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn-confirm { width: 100%; background-color: #673ab7; color: #fff; border: none; padding: 12px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .input-field { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .free-tag { color: #2e7d32; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">RS Arena</div>
        <div class="wallet-badge">💰 Wallet: ৳<span id="userBalance">0</span></div>
    </header>

    <div class="container">
        <div class="deposit-card">
            <h3>📥 টাকা অ্যাড করুন</h3>
            <p style="font-size: 14px; margin: 10px 0;">বিকাশ/নগদ নম্বর: <strong>01851634841</strong></p>
            <input type="number" class="input-field" id="amt" placeholder="কত টাকা পেমেন্ট করেছেন?">
            <input type="text" class="input-field" id="trx" placeholder="Transaction ID">
            <button class="btn-confirm" style="background:#ffc107; color:#000;" onclick="requestDeposit()">পেমেন্ট রিকোয়েস্ট পাঠান</button>
        </div>

        <div id="matchList"></div>
    </div>

    <script>
        let balance = 0;
        let container = document.getElementById('matchList');

        for (let i = 1; i <= 100; i++) {
            let fee = (i <= 5) ? 0 : ((i % 3 === 0) ? 50 : 20);
            let feeText = (fee === 0) ? "<span class='free-tag'>FREE</span>" : fee + " TK";

            container.innerHTML += `
            <div class="app-card">
                <b>Tournament Match #${i}</b><br> এন্ট্রি ফি: ${feeText}
                <div id="joinArea_m${i}">
                    <input type="text" class="input-field" id="name_m${i}" placeholder="আপনার গেমের নাম">
                    <input type="number" class="input-field" id="phone_m${i}" placeholder="হোয়াটসঅ্যাপ নম্বর (যেমন: 8801XXXXXXXXX)">
                    <button class="btn-confirm" onclick="joinMatch('m${i}', ${fee})">জয়েন করুন</button>
                </div>
            </div>`;
        }

        function requestDeposit() {
            let amt = document.getElementById('amt').value;
            let trx = document.getElementById('trx').value;
            if(amt && trx) {
                alert("পেমেন্ট রিকোয়েস্ট জমা হয়েছে! অ্যাডমিন চেক করে ব্যালেন্স আপডেট করে দিবে।");
                document.getElementById('amt').value = "";
                document.getElementById('trx').value = "";
            } else {
                alert("তথ্য পূরণ করুন!");
            }
        }

        function joinMatch(id, fee) {
            let name = document.getElementById('name_'+id).value;
            let phone = document.getElementById('phone_'+id).value;

            if (!name || !phone) {
                alert("দয়া করে নাম এবং হোয়াটসঅ্যাপ নম্বর দিন!");
                return;
            }

            if (fee === 0 || balance >= fee) {
                if (fee > 0) balance -= fee;
                document.getElementById('userBalance').innerText = balance;
                
                document.getElementById('joinArea_'+id).innerHTML = "<p style='color:blue; font-weight:bold;'>অপেক্ষমাণ: ম্যাচ শুরুর ৫ মিনিট আগে হোয়াটসঅ্যাপে মেসেজ যাবে।</p>";
                
                // ৫ মিনিট = ৩০০,০০০ মিলিসেকেন্ড পর মেসেজ পাঠানো
                setTimeout(() => {
                    let roomID = "9988" + id.replace('m', '');
                    let waText = `RS Arena: ম্যাচ শুরু হচ্ছে! রুম আইডি: ${roomID}, পাসওয়ার্ড: 1234. দ্রুত জয়েন করুন।`;
                    window.location.href = "https://wa.me/" + phone + "?text=" + encodeURIComponent(waText);
                }, 300000); 

                alert("সফলভাবে জয়েন করেছেন! ৫ মিনিট পর হোয়াটসঅ্যাপে রুম আইডি ও পাসওয়ার্ড পাঠানো হবে।");
            } else {
                alert("আপনার ব্যালেন্স কম! আগে পেমেন্ট করুন।");
            }
        }
    </script>
</body>
</html>
